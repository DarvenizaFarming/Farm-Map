<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cattle Manager — Darveniza's Tropical Fruit</title>
<style>
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; background:#f4f1ea; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; color:#1b3a2b; }
  header { background:#1b3a2b; color:#fff; padding:16px 18px; display:flex; align-items:center; gap:12px; }
  header a { color:#cfe8d8; text-decoration:none; font-size:14px; }
  header h1 { font-size:17px; margin:0; }
  main { max-width:560px; margin:0 auto; padding:16px 16px 60px; }
  .tabs { display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  .tabs button { flex:1; min-width:70px; padding:9px 4px; border-radius:8px; border:1px solid #cfd8d2; background:#fff; font-size:12px; }
  .tabs button.active { background:#1b3a2b; color:#fff; border-color:#1b3a2b; }
  .pane { display:none; }
  .pane.active { display:block; }
  label { display:block; font-weight:600; font-size:13px; margin:16px 0 6px; }
  label:first-child { margin-top:0; }
  input[type=date], input[type=text], select, textarea {
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid #cfd8d2; font-size:15px; background:#fff;
  }
  textarea { min-height:60px; resize:vertical; }
  .checklist { max-height:200px; overflow-y:auto; border:1px solid #cfd8d2; border-radius:10px; background:#fff; padding:6px; }
  .checkrow { display:flex; align-items:center; gap:10px; padding:8px 6px; border-bottom:1px solid #f0f0ea; font-size:14px; }
  .checkrow:last-child { border-bottom:none; }
  .checkrow input { width:18px; height:18px; }
  .search { margin-bottom:8px; }
  button.submit {
    margin-top:22px; width:100%; padding:14px; border:none; border-radius:12px; background:#1b3a2b; color:#fff;
    font-size:16px; font-weight:600;
  }
  button.submit:disabled { opacity:.5; }
  .card { background:#fff; border-radius:12px; padding:14px; margin-bottom:10px; box-shadow:0 2px 6px rgba(0,0,0,.06); }
  .card .title { font-weight:600; font-size:15px; }
  .card .meta { font-size:12px; color:#888; margin-top:3px; }
  .card .row { display:flex; align-items:center; gap:8px; margin-top:10px; }
  .card select { flex:1; padding:8px; border-radius:8px; border:1px solid #cfd8d2; font-size:13px; }
  .badge { display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:600; }
  .badge.pending { background:#fff3cd; color:#856404; }
  .badge.verified { background:#d1e7dd; color:#0f5132; }
  .loading, .empty { padding:30px; text-align:center; color:#888; }
</style>
</head>
<body>
<header>
  <a href="index.html">&larr;</a>
  <h1>🐄 Cattle Manager</h1>
</header>
<main>
  <div class="tabs">
    <button class="active" data-t="move">🚚 Move</button>
    <button data-t="treat">💉 Treat</button>
    <button data-t="rotation">📋 Rotation</button>
    <button data-t="board">📊 Board</button>
  </div>

  <div class="pane active" id="pane-move">
    <div id="moveForm"><div class="loading">Loading…</div></div>
  </div>
  <div class="pane" id="pane-treat">
    <div id="treatForm"><div class="loading">Loading…</div></div>
  </div>
  <div class="pane" id="pane-rotation">
    <div id="rotationList"><div class="loading">Loading…</div></div>
  </div>
  <div class="pane" id="pane-board">
    <div id="boardList"><div class="loading">Loading…</div></div>
  </div>
</main>

<script src="app.js"></script>
<script>
if (APP.checkPin()) {
  (async function () {
    document.querySelectorAll(".tabs button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".pane").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("pane-" + btn.getAttribute("data-t")).classList.add("active");
      });
    });

    let blocks = [], mobs = [], animals = [], rotationLog = [], treatments = [];
    try {
      [blocks, mobs, animals] = await Promise.all([
        APP.list(APP.TABLES.blocks, { "fields[]": "Block", "sort[0][field]": "Block", "sort[0][direction]": "asc" }),
        APP.list(APP.TABLES.mobs, { "sort[0][field]": "Mob", "sort[0][direction]": "asc" }),
        APP.list(APP.TABLES.animalRegister, { filterByFormula: "{Status}='Active'", "fields[]": "Tag Number" })
      ]);
    } catch (err) {
      console.error(err);
      APP.toast("Couldn't load reference data", true);
    }

    // ---- Move Cattle (Block Rotation Log) ----
    (function buildMoveForm() {
      const wrap = document.getElementById("moveForm");
      wrap.innerHTML = "";
      const form = document.createElement("form");
      form.appendChild(APP.el("label", { text: "Date" }));
      const dateInput = APP.el("input", { type: "date", value: APP.todayISO() });
      form.appendChild(dateInput);

      form.appendChild(APP.el("label", { text: "Mob" }));
      const mobSelect = APP.el("select");
      mobSelect.appendChild(APP.el("option", { value: "", text: "— select mob —" }));
      mobs.forEach(m => mobSelect.appendChild(APP.el("option", { value: m.id, text: m.fields.Mob || "(unnamed)" })));
      form.appendChild(mobSelect);

      form.appendChild(APP.el("label", { text: "Moved to block" }));
      const blockSelect = APP.el("select");
      blockSelect.appendChild(APP.el("option", { value: "", text: "— select block —" }));
      blocks.forEach(b => blockSelect.appendChild(APP.el("option", { value: b.id, text: b.fields.Block || "(unnamed)" })));
      form.appendChild(blockSelect);

      form.appendChild(APP.el("label", { text: "Notes (optional)" }));
      const notes = APP.el("textarea");
      form.appendChild(notes);

      const btn = APP.el("button", { class: "submit", type: "submit", text: "Log move" });
      form.appendChild(btn);

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!mobSelect.value || !blockSelect.value) { APP.toast("Pick a mob and a block", true); return; }
        btn.disabled = true; btn.textContent = "Saving…";
        try {
          const res = await APP.createRecords(APP.TABLES.rotationLog, [{
            fields: { "Date": dateInput.value, "Mob": [mobSelect.value], "Block": [blockSelect.value], "Notes": notes.value }
          }]);
          rotationLog.unshift(res.records[0]);
          APP.toast("Saved ✓");
          form.reset(); dateInput.value = APP.todayISO();
          renderRotation();
        } catch (err) { console.error(err); APP.toast("Couldn't save", true); }
        finally { btn.disabled = false; btn.textContent = "Log move"; }
      });
      wrap.appendChild(form);
    })();

    // ---- Treatment (Treatments Log) ----
    (function buildTreatForm() {
      const wrap = document.getElementById("treatForm");
      wrap.innerHTML = "";
      const form = document.createElement("form");
      form.appendChild(APP.el("label", { text: "Date" }));
      const dateInput = APP.el("input", { type: "date", value: APP.todayISO() });
      form.appendChild(dateInput);

      form.appendChild(APP.el("label", { text: "Tag number(s)" }));
      const search = APP.el("input", { type: "text", class: "search", placeholder: "Search tags…" });
      form.appendChild(search);
      const checklist = APP.el("div", { class: "checklist" });
      animals.forEach(a => {
        const row = APP.el("label", { class: "checkrow", "data-name": (a.fields["Tag Number"] || "").toLowerCase() });
        const cb = APP.el("input", { type: "checkbox", value: a.id });
        row.appendChild(cb);
        row.appendChild(document.createTextNode(a.fields["Tag Number"] || "(no tag)"));
        checklist.appendChild(row);
      });
      form.appendChild(checklist);
      search.addEventListener("input", () => {
        const q = search.value.toLowerCase();
        checklist.querySelectorAll(".checkrow").forEach(r => { r.style.display = r.getAttribute("data-name").includes(q) ? "flex" : "none"; });
      });

      form.appendChild(APP.el("label", { text: "Treatment" }));
      const treatSelect = APP.el("select");
      ["Drenching", "Vaccination", "Tagging/Re-tagging", "Weighing", "Pregnancy Testing", "Branding", "De-horning", "NILS tag", "Castrating"].forEach(t =>
        treatSelect.appendChild(APP.el("option", { value: t, text: t })));
      form.appendChild(treatSelect);

      form.appendChild(APP.el("label", { text: "Product / dose (leave blank for Weighing)" }));
      const doseInput = APP.el("input", { type: "text" });
      form.appendChild(doseInput);
      const weightWrap = document.createElement("div");
      weightWrap.style.display = "none";
      weightWrap.appendChild(APP.el("label", { text: "Weight (kg)" }));
      const weightInput = APP.el("input", { type: "text" });
      weightWrap.appendChild(weightInput);
      form.appendChild(weightWrap);
      treatSelect.addEventListener("change", () => {
        weightWrap.style.display = treatSelect.value === "Weighing" ? "block" : "none";
      });

      form.appendChild(APP.el("label", { text: "Administered by" }));
      const adminInput = APP.el("input", { type: "text", placeholder: "Your name" });
      form.appendChild(adminInput);

      form.appendChild(APP.el("label", { text: "Notes (optional)" }));
      const notes = APP.el("textarea");
      form.appendChild(notes);

      const btn = APP.el("button", { class: "submit", type: "submit", text: "Log treatment" });
      form.appendChild(btn);

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const selectedTags = Array.from(checklist.querySelectorAll("input:checked")).map(cb => cb.value);
        if (!selectedTags.length) { APP.toast("Pick at least one tag", true); return; }
        btn.disabled = true; btn.textContent = "Saving…";
        try {
          const fields = {
            "Date": dateInput.value,
            "Tag Number": selectedTags,
            "Treatment": treatSelect.value,
            "Administered By": adminInput.value,
            "Notes": notes.value,
            "Status": "Pending Review"
          };
          if (treatSelect.value === "Weighing" && weightInput.value) fields["Weight (kg)"] = parseFloat(weightInput.value);
          else fields["Product/Dose"] = doseInput.value;
          const res = await APP.createRecords(APP.TABLES.treatmentsLog, [{ fields }]);
          treatments.unshift(res.records[0]);
          APP.toast("Saved ✓");
          form.reset();
          checklist.querySelectorAll("input:checked").forEach(cb => cb.checked = false);
          dateInput.value = APP.todayISO();
          renderBoard();
        } catch (err) { console.error(err); APP.toast("Couldn't save", true); }
        finally { btn.disabled = false; btn.textContent = "Log treatment"; }
      });
      wrap.appendChild(form);
    })();

    // ---- Rotation Log view ----
    function renderRotation() {
      const el = document.getElementById("rotationList");
      el.innerHTML = "";
      if (!rotationLog.length) { el.innerHTML = '<div class="empty">No moves logged yet.</div>'; return; }
      const sorted = [...rotationLog].sort((a, b) => (b.fields.Date || "").localeCompare(a.fields.Date || ""));
      sorted.forEach(r => {
        const card = APP.el("div", { class: "card" });
        const mobName = (mobs.find(m => (r.fields.Mob || [])[0] === m.id) || {}).fields?.Mob || "?";
        const blockName = (blocks.find(b => (r.fields.Block || [])[0] === b.id) || {}).fields?.Block || "?";
        card.appendChild(APP.el("div", { class: "title", text: mobName + " → " + blockName }));
        card.appendChild(APP.el("div", { class: "meta", text: (r.fields.Date || "") + (r.fields.Notes ? " · " + r.fields.Notes : "") }));
        el.appendChild(card);
      });
    }

    // ---- Treatments Board view ----
    function renderBoard() {
      const el = document.getElementById("boardList");
      el.innerHTML = "";
      if (!treatments.length) { el.innerHTML = '<div class="empty">No treatments logged yet.</div>'; return; }
      const sorted = [...treatments].sort((a, b) => (b.fields.Date || "").localeCompare(a.fields.Date || ""));
      sorted.forEach(t => {
        const card = APP.el("div", { class: "card" });
        const tagCount = (t.fields["Tag Number"] || []).length;
        card.appendChild(APP.el("div", { class: "title", text: (t.fields.Treatment || "") + " — " + tagCount + " animal" + (tagCount === 1 ? "" : "s") }));
        const badge = APP.el("span", { class: "badge " + (t.fields.Status === "Verified" ? "verified" : "pending"), text: t.fields.Status || "Pending Review" });
        const meta = APP.el("div", { class: "meta" });
        meta.appendChild(badge);
        meta.appendChild(document.createTextNode(" " + (t.fields.Date || "") + (t.fields["Product/Dose"] ? " · " + t.fields["Product/Dose"] : "")));
        card.appendChild(meta);
        if (t.fields.Status !== "Verified") {
          const row = APP.el("div", { class: "row" });
          const btn = APP.el("button", { class: "submit", style: "margin:0;padding:8px 12px;font-size:13px;", text: "Mark verified" });
          btn.addEventListener("click", async () => {
            btn.disabled = true;
            try {
              await APP.updateRecords(APP.TABLES.treatmentsLog, [{ id: t.id, fields: { "Status": "Verified" } }]);
              t.fields.Status = "Verified";
              APP.toast("Verified ✓");
              renderBoard();
            } catch (err) { console.error(err); APP.toast("Couldn't update", true); }
          });
          row.appendChild(btn);
          card.appendChild(row);
        }
        el.appendChild(card);
      });
    }

    try {
      [rotationLog, treatments] = await Promise.all([
        APP.list(APP.TABLES.rotationLog),
        APP.list(APP.TABLES.treatmentsLog)
      ]);
      renderRotation();
      renderBoard();
    } catch (err) {
      console.error(err);
      document.getElementById("rotationList").innerHTML = '<div class="empty">Couldn\'t load. Check connection.</div>';
      document.getElementById("boardList").innerHTML = '<div class="empty">Couldn\'t load. Check connection.</div>';
    }
  })();
}
</script>
</body>
</html>
