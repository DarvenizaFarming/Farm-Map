<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spray — Darveniza's Tropical Fruit</title>
<style>
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; background:#f4f1ea; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; color:#1b3a2b; }
  header { background:#1b3a2b; color:#fff; padding:16px 18px; display:flex; align-items:center; gap:12px; }
  header a { color:#cfe8d8; text-decoration:none; font-size:14px; }
  header h1 { font-size:17px; margin:0; }
  main { max-width:520px; margin:0 auto; padding:18px 16px 60px; }
  label { display:block; font-weight:600; font-size:13px; margin:18px 0 6px; }
  input[type=date], input[type=time], input[type=number], input[type=text], select, textarea {
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid #cfd8d2; font-size:15px; background:#fff;
  }
  textarea { min-height:70px; resize:vertical; }
  .checklist { max-height:220px; overflow-y:auto; border:1px solid #cfd8d2; border-radius:10px; background:#fff; padding:6px; }
  .checkrow { display:flex; align-items:center; gap:10px; padding:8px 6px; border-bottom:1px solid #f0f0ea; font-size:14px; }
  .checkrow:last-child { border-bottom:none; }
  .checkrow input { width:18px; height:18px; }
  .search { margin-bottom:8px; }
  button.submit {
    margin-top:26px; width:100%; padding:14px; border:none; border-radius:12px; background:#1b3a2b; color:#fff;
    font-size:16px; font-weight:600;
  }
  button.submit:disabled { opacity:.5; }
  .hint { font-size:12px; color:#888; margin-top:4px; }
  .loading { padding:40px; text-align:center; color:#888; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
</style>
</head>
<body>
<header>
  <a href="index.html">&larr;</a>
  <h1>🧴 Spray</h1>
</header>
<main id="app"><div class="loading">Loading…</div></main>

<script src="app.js"></script>
<script>
if (APP.checkPin()) {
  (async function () {
    const app = document.getElementById("app");
    try {
      const [blocks, batches] = await Promise.all([
        APP.list(APP.TABLES.blocks, { "fields[]": "Block", "sort[0][field]": "Block", "sort[0][direction]": "asc" }),
        APP.list(APP.TABLES.chemicalShed, { filterByFormula: "{Status}='In Stock'", "fields[]": "Product — Batch (drag to front)" })
      ]);

      app.innerHTML = "";
      const form = document.createElement("form");

      const row2a = APP.el("div", { class: "row2" });
      const dateWrap = document.createElement("div");
      dateWrap.appendChild(APP.el("label", { text: "Date" }));
      const dateInput = APP.el("input", { type: "date", value: APP.todayISO() });
      dateWrap.appendChild(dateInput);
      const timeWrap = document.createElement("div");
      timeWrap.appendChild(APP.el("label", { text: "Time" }));
      const timeInput = APP.el("input", { type: "time" });
      timeWrap.appendChild(timeInput);
      row2a.appendChild(dateWrap); row2a.appendChild(timeWrap);
      form.appendChild(row2a);

      form.appendChild(APP.el("label", { text: "Block(s)" }));
      const search = APP.el("input", { type: "text", class: "search", placeholder: "Search blocks…" });
      form.appendChild(search);
      const checklist = APP.el("div", { class: "checklist" });
      blocks.forEach(b => {
        const row = APP.el("label", { class: "checkrow", "data-name": (b.fields.Block || "").toLowerCase() });
        const cb = APP.el("input", { type: "checkbox", value: b.id });
        row.appendChild(cb);
        row.appendChild(document.createTextNode(b.fields.Block || "(unnamed)"));
        checklist.appendChild(row);
      });
      form.appendChild(checklist);
      search.addEventListener("input", () => {
        const q = search.value.toLowerCase();
        checklist.querySelectorAll(".checkrow").forEach(r => {
          r.style.display = r.getAttribute("data-name").includes(q) ? "flex" : "none";
        });
      });

      form.appendChild(APP.el("label", { text: "Chemical batch" }));
      const batchSelect = APP.el("select");
      batchSelect.appendChild(APP.el("option", { value: "", text: "— select product/batch —" }));
      batches.forEach(b => {
        const label = (b.fields["Product — Batch (drag to front)"] || "(unnamed batch)");
        batchSelect.appendChild(APP.el("option", { value: b.id, text: label }));
      });
      form.appendChild(batchSelect);
      form.appendChild(APP.el("div", { class: "hint", text: "One product per submission - spraying two products together? Submit again for the second one." }));

      form.appendChild(APP.el("label", { text: "Rate" }));
      const rateInput = APP.el("input", { type: "text", placeholder: "e.g. 2 L/ha or 500 mL/100L water" });
      form.appendChild(rateInput);

      const row2b = APP.el("div", { class: "row2" });
      const windSpeedWrap = document.createElement("div");
      windSpeedWrap.appendChild(APP.el("label", { text: "Wind speed (km/h)" }));
      const windSpeed = APP.el("input", { type: "number", step: "1", min: "0" });
      windSpeedWrap.appendChild(windSpeed);
      const windDirWrap = document.createElement("div");
      windDirWrap.appendChild(APP.el("label", { text: "Wind direction" }));
      const windDir = APP.el("select");
      windDir.appendChild(APP.el("option", { value: "", text: "—" }));
      ["N", "NE", "E", "SE", "S", "SW", "W", "NW"].forEach(d => windDir.appendChild(APP.el("option", { value: d, text: d })));
      windDirWrap.appendChild(windDir);
      row2b.appendChild(windSpeedWrap); row2b.appendChild(windDirWrap);
      form.appendChild(row2b);

      form.appendChild(APP.el("label", { text: "Applicator" }));
      const applicator = APP.el("input", { type: "text", placeholder: "Your name" });
      form.appendChild(applicator);

      form.appendChild(APP.el("label", { text: "Notes (optional)" }));
      const notes = APP.el("textarea");
      form.appendChild(notes);
      form.appendChild(APP.el("div", { class: "hint", text: "If the batch/DOM number here doesn't match the product, note the correct one here." }));

      const submitBtn = APP.el("button", { class: "submit", type: "submit", text: "Log spray application" });
      form.appendChild(submitBtn);

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const selectedBlocks = Array.from(checklist.querySelectorAll("input:checked")).map(cb => cb.value);
        if (!selectedBlocks.length) { APP.toast("Pick at least one block", true); return; }
        if (!batchSelect.value) { APP.toast("Pick a chemical batch", true); return; }
        submitBtn.disabled = true; submitBtn.textContent = "Saving…";
        try {
          await APP.createRecords(APP.TABLES.sprayLog, [{
            fields: {
              "Date": dateInput.value,
              "Time": timeInput.value,
              "Blocks": selectedBlocks,
              "Chemical Batch": [batchSelect.value],
              "Rate": rateInput.value,
              "Wind Speed (km/h)": windSpeed.value ? parseFloat(windSpeed.value) : undefined,
              "Wind Direction": windDir.value || undefined,
              "Applicator": applicator.value,
              "Notes": notes.value
            }
          }]);
          APP.toast("Saved ✓");
          form.reset();
          checklist.querySelectorAll("input:checked").forEach(cb => cb.checked = false);
          dateInput.value = APP.todayISO();
        } catch (err) {
          console.error(err);
          APP.toast("Couldn't save - check connection and try again", true);
        } finally {
          submitBtn.disabled = false; submitBtn.textContent = "Log spray application";
        }
      });

      app.appendChild(form);
    } catch (err) {
      console.error(err);
      app.innerHTML = '<div class="loading">Couldn\'t load form data. Check your connection and reload.</div>';
    }
  })();
}
</script>
</body>
</html>
